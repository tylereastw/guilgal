[build]
  publish = "."

# Projects are private. Old /projects/ links go to the partner area, where the gate
# sends anyone not signed in to the login screen and returns them here afterwards.
[[redirects]]
  from = "/projects/hydropower-projects/*"
  to = "/members/projects/hydropower/"
  status = 301

[[redirects]]
  from = "/projects/:slug/*"
  to = "/members/projects/:slug/"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/members/"
  status = 301

[[redirects]]
  from = "/projects/"
  to = "/members/"
  status = 301

[[headers]]
  for = "/archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
