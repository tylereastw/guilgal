[build]
  # Publish only the website files (tools/stage.mjs copies them into dist/), so source,
  # tooling and notes are never served.
  command = "node tools/stage.mjs"
  publish = "dist"

# Projects are private. Old /projects/ links go to the partner area, where the gate
# sends anyone not signed in to the login screen and returns them here afterwards.
[[redirects]]
  from = "/projects/hydropower-projects/*"
  to = "/members/projects/hydropower/"
  status = 301

[[redirects]]
  from = "/projects/:slug/*"
  to = "/members/projects/:slug/"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/members/"
  status = 301

[[redirects]]
  from = "/projects/"
  to = "/members/"
  status = 301

# Briefs are generated from each project page at build time (brief.pdf). Old links to
# the retired upload endpoint go straight to the generated PDF, still behind the login.
[[redirects]]
  from = "/members/projects/:slug/brief"
  to = "/members/projects/:slug/brief.pdf"
  status = 301
  force = true

# News & Milestones is paused for now.
[[redirects]]
  from = "/news/*"
  to = "/"
  status = 302

[[headers]]
  for = "/archive/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
